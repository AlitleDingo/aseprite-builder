
name: Build and release Aseprite (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'BuildLog.md'

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  fetch-aseprite-info:
    name: Fetch latest stable release
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Find latest stable Aseprite release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          TAG=$(curl -fsSL \
            https://api.github.com/repos/aseprite/aseprite/releases \
            | jq -er '
                [.[] | select(.draft == false and .prerelease == false)]
                | first
                | .tag_name
              ')

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Selected stable release: $TAG"

  build-aseprite:
    name: Build Aseprite for Windows x64
    needs: fetch-aseprite-info
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build tools
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          choco install 7zip -y --no-progress

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download official Aseprite source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          git clone --recurse-submodules `
            --branch "$env:RELEASE_TAG" `
            https://github.com/aseprite/aseprite.git aseprite

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download Aseprite source."
          }

      - name: Install compatible Skia
        shell: pwsh
        working-directory: aseprite
        run: |
          $skiaUrl = bash laf/misc/skia-url.sh Release

          if ($LASTEXITCODE -ne 0 -or -not $skiaUrl) {
            throw "Failed to determine the compatible Skia download URL."
          }

          $skiaUrl = $skiaUrl.Trim()
          Write-Host "Downloading Skia: $skiaUrl"

          New-Item -ItemType Directory -Force -Path skia | Out-Null

          $archive = Join-Path $PWD "skia-package.zip"
          curl.exe -fL --retry 3 $skiaUrl -o $archive

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download Skia."
          }

          7z x $archive "-oskia" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract Skia."
          }

      - name: Configure build
        shell: pwsh
        working-directory: aseprite
        run: |
          $skiaDir = (Resolve-Path skia).Path
          $skiaLib = Join-Path $skiaDir "out/Release-x64"

          if (-not (Test-Path $skiaLib)) {
            throw "Skia library directory not found: $skiaLib"
          }

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_TESTS=OFF `
            -DENABLE_SCRIPTING=ON `
            -DENABLE_CCACHE=OFF `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR="$skiaDir" `
            -DSKIA_LIBRARY_DIR="$skiaLib" `
            -DOPENSSL_USE_STATIC_LIBS=ON

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

      - name: Compile Aseprite
        shell: pwsh
        working-directory: aseprite
        run: |
          cmake --build build --config Release --parallel 4

          if ($LASTEXITCODE -ne 0) {
            throw "Aseprite compilation failed."
          }

      - name: Prepare portable build
        shell: pwsh
        working-directory: aseprite/build/bin
        run: |
          if (-not (Test-Path aseprite.exe)) {
            throw "aseprite.exe was not produced."
          }

          @"
          # This file makes Aseprite behave as a portable program.
          "@ | Set-Content -Encoding ascii aseprite.ini

      - name: Package Windows build
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          $archive = "Aseprite-$env:RELEASE_TAG-Windows-x64.zip"
          $source = Join-Path $PWD "aseprite/build/bin/*"

          Compress-Archive -Path $source `
            -DestinationPath $archive `
            -CompressionLevel Optimal

          "ASSET=$archive" >> $env:GITHUB_ENV

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          name: Aseprite ${{ needs.fetch-aseprite-info.outputs.release-tag }} - Windows x64
          body: |
            Windows x64 portable build of the official Aseprite stable source.

            Built with MSVC, CMake, Ninja, and the compatible Skia dependency.
            Lua scripting enabled.
          artifacts: ${{ env.ASSET }}
          artifactContentType: application/zip
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
